<style>

}

  src: url('./worldcup-penalty-plan/_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400;
}
:root {
  --bg: #0a0612; --bg2: #1a0c20; --bg3: #2a1830;
  --ink: #fff8e8; --ink2: #ffe8c0;
  --muted: #b090a0; --gold: #ffdd22; --gold-dim: rgba(255,221,34,0.2);
  --red: #ff2200; --green: #00dd44; --blue: #00aaff;
  --orange: #ff8800;
  --font: 'InstrumentSans', sans-serif;

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1;padding:1rem}

/* === MENU === */
#screen-menu{background:radial-gradient(ellipse at 50% 80%,#ff4400,#cc1100 30%,#1a0600 70%,#000 100%)}
.menu-title{font-family:var(--font-heading);font-size:clamp(2.6rem,10vw,4.8rem);letter-spacing:.04em;color:var(--gold);text-align:center;line-height:1;text-shadow:3px 3px 0 var(--outline),0 0 50px rgba(255,221,51,.3);margin-bottom:.15rem}
.menu-title span{display:block;font-size:clamp(1rem,3.5vw,1.6rem);color:var(--ink2);margin-top:.2rem;letter-spacing:.1em}
.menu-ball{width:64px;height:64px;margin:.75rem auto;position:relative;animation:bounce 1.5s ease-in-out infinite;filter:drop-shadow(2px 4px 8px rgba(0,0,0,.4))}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0deg)}40%{transform:translateY(-14px) rotate(200deg)}60%{transform:translateY(-6px) rotate(280deg)}}
.btn-group{display:flex;flex-direction:column;gap:.7rem;width:100%;max-width:300px;margin-top:.3rem}
.btn{display:block;width:100%;padding:.85rem 1.5rem;border:3px solid var(--outline);border-radius:14px;font-family:var(--font-heading);font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .08s,box-shadow .08s;touch-action:manipulation;box-shadow:3px 3px 0 var(--outline)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--outline)}
.btn-primary{background:linear-gradient(135deg,var(--gold),#ffbb22);color:var(--outline)}
.btn-secondary{background:var(--bg2);color:var(--ink2);border-color:var(--muted);box-shadow:3px 3px 0 var(--muted)}
.btn-danger{background:var(--bg2);color:var(--red);border-color:rgba(255,68,34,.3);box-shadow:3px 3px 0 rgba(255,68,34,.3)}

/* === MODE SELECT === */
#screen-mode{background:var(--bg)}
.mode-title{font-family:var(--font-heading);font-size:clamp(1.5rem,5vw,2.2rem);color:var(--gold);text-align:center;margin-bottom:.25rem;text-shadow:2px 2px 0 var(--outline)}

.mode-card{background:var(--bg2);border:3px solid var(--muted);border-radius:16px;padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;box-shadow:4px 4px 0 var(--muted)}
.mode-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:4px 4px 0 var(--gold-dim)}
.mode-card.selected{border-color:var(--gold);box-shadow:0 0 25px var(--gold-dim)}
.mode-icon{font-size:2.5rem;margin-bottom:.5rem}
.mode-name{font-family:var(--font-heading);font-size:1.2rem;color:var(--ink);margin-bottom:.2rem}

/* === PLAYER SELECT === */

.pick-carousel{width:100%;flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;display:flex;align-items:center;padding:.5rem 0;scroll-snap-type:x mandatory}
.pick-carousel::-webkit-scrollbar{height:4px}
.pick-carousel::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}
.pick-card{flex:0 0 220px;height:min(340px,80vh);margin:0 .5rem;background:var(--bg2);border:2px solid var(--muted);border-radius:16px;padding:.75rem;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;transition:border-color .2s,transform .2s;cursor:pointer;position:relative}
.pick-card.selected{border-color:var(--gold);transform:scale(1.03);box-shadow:0 0 25px var(--gold-dim)}
.pick-card img.player-portrait{width:120px;height:140px;border-radius:8px;background:var(--bg3);object-fit:cover}
.pick-name{font-family:var(--font-heading);font-size:1.1rem;color:var(--ink);margin-top:.35rem}
.pick-name-en{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pick-country{font-size:.7rem;color:var(--ink2);margin-top:.1rem}
.pick-number{position:absolute;top:.4rem;right:.6rem;font-family:var(--font-heading);font-size:1.2rem;color:rgba(255,255,255,.15)}
.pick-stats{width:100%;margin-top:.25rem;display:flex;flex-direction:column;gap:2px}
.pick-stat-row{display:flex;justify-content:space-between;font-size:.62rem;align-items:center}
.pick-stat-label{color:var(--muted)}
.pick-stat-bar{flex:1;height:5px;background:var(--bg3);border-radius:3px;margin:0 .4rem;overflow:hidden}
.pick-stat-fill{height:100%;border-radius:3px;transition:width .3s}
.pick-style-tag{padding:.15rem .5rem;border-radius:4px;font-size:.6rem;font-family:var(--font-heading);letter-spacing:.04em;margin-top:.15rem;background:var(--gold-dim);color:var(--gold)}
.pick-confirm{margin-top:.6rem;max-width:300px;width:100%;padding:.65rem;font-size:.95rem}

/* === INTRO === */
#screen-intro{background:#000;overflow:hidden}
.intro-canvas{position:absolute;top:0;left:0;width:100%;height:100%}

/* === SETTINGS === */
#screen-settings{background:var(--bg)}
.settings-box{width:100%;max-width:340px;background:var(--bg2);border:3px solid var(--muted);border-radius:16px;padding:1.75rem;box-shadow:4px 4px 0 var(--muted)}
.settings-title{font-family:var(--font-heading);font-size:1.6rem;color:var(--gold);text-align:center;margin-bottom:1.25rem}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:.65rem 0;border-bottom:2px dashed var(--muted)}
.setting-row:last-of-type{border-bottom:none}
.setting-label{font-size:.9rem;color:var(--ink2)}
.setting-control{display:flex;gap:.3rem;align-items:center}
.setting-btn{width:34px;height:34px;border:2px solid var(--muted);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.setting-value{min-width:32px;text-align:center;font-family:var(--font-heading);font-size:1.3rem;color:var(--gold)}
.diff-btns{display:flex;gap:.3rem}
.diff-btn{padding:.3rem .7rem;border:2px solid var(--muted);border-radius:8px;background:var(--bg);color:var(--ink2);font-size:.78rem;cursor:pointer}
.diff-btn.active{border-color:var(--gold);color:var(--gold);background:var(--bg2)}
.diff-btn.easy.active{border-color:var(--green);color:var(--green)}
.diff-btn.hard.active{border-color:var(--red);color:var(--red)}

/* === GAME === */
#screen-game{padding:0;background:var(--bg);justify-content:flex-start}
.game-hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:.5rem .75rem;background:linear-gradient(180deg,rgba(18,8,32,.95),transparent);z-index:5;position:absolute;top:0;left:0}
.hud-left{display:flex;align-items:center;gap:.5rem}
.hud-player-icon{width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;background:var(--bg3)}
.hud-player-icon img{width:100%;height:100%;object-fit:cover}
.hud-round{font-family:var(--font-heading);font-size:.9rem;color:var(--ink2)}
.hud-round strong{color:var(--gold);font-size:1.1rem}
.hud-score{display:flex;align-items:center;gap:.3rem}
.hud-score-num{font-family:var(--font-heading);font-size:1.5rem;color:var(--gold)}
.hud-score-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hud-exit{width:32px;height:32px;border:2px solid var(--muted);border-radius:50%;background:var(--bg2);color:var(--muted);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.canvas-wrap{width:100%;flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none}

.phase-hint{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);font-family:var(--font-heading);font-size:clamp(.85rem,2.5vw,1.1rem);letter-spacing:.08em;color:var(--gold);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;white-space:nowrap;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.phase-hint.show{opacity:1}

.power-ui{position:absolute;right:max(6px,env(safe-area-inset-right));bottom:10%;display:none;flex-direction:column;align-items:center;gap:.2rem;z-index:8}
.power-ui.show{display:flex}
.power-label{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-heading)}
.power-track-v{width:24px;height:120px;max-height:28vh;background:rgba(0,0,0,.4);border:2px solid var(--muted);border-radius:12px;overflow:hidden;position:relative}
.power-fill-v{position:absolute;bottom:0;left:0;width:100%;height:0%;border-radius:10px;transition:height .04s linear;background:linear-gradient(0deg,var(--green),var(--gold),var(--red))}
.power-pct{font-family:var(--font-heading);font-size:.8rem;color:var(--ink2);text-shadow:1px 1px 0 rgba(0,0,0,.5)}

.charge-bar-wrap{position:absolute;bottom:2.5%;left:50%;transform:translateX(-50%);width:min(220px,55%);display:none;flex-direction:column;align-items:center;gap:.1rem;z-index:8}
.charge-bar-wrap.show{display:flex}
.charge-label{font-size:.65rem;color:var(--gold);font-family:var(--font-heading);letter-spacing:.06em;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.charge-track{width:100%;height:12px;background:rgba(0,0,0,.4);border:2px solid var(--muted);border-radius:6px;overflow:hidden}
.charge-fill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width .03s linear}
.charge-pct{font-family:var(--font-heading);font-size:.7rem;color:var(--ink2)}

/* GK dive buttons */
.gk-dive-pad{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:min(260px,70%);display:none;grid-template-columns:1fr 1fr 1fr;gap:.4rem;z-index:8}
.gk-dive-pad.show{display:grid}
.gk-dive-btn{padding:.5rem .3rem;border:2px solid var(--muted);border-radius:8px;background:var(--bg2);color:var(--ink2);font-size:.7rem;font-family:var(--font-heading);cursor:pointer;text-align:center;transition:border-color .15s}
.gk-dive-btn:hover{border-color:var(--gold);color:var(--gold)}
.gk-dive-btn:active{transform:scale(.95)}

.player-name-tag{position:absolute;top:8%;left:5%;font-family:var(--font-heading);font-size:clamp(.9rem,3vw,1.3rem);color:var(--gold);opacity:0;transition:opacity .5s;pointer-events:none;z-index:6}
.player-name-tag.show{opacity:1}
.player-name-tag .sub{font-size:.5rem;color:var(--muted);letter-spacing:.1em;display:block;text-transform:uppercase}

/* === RESULT === */
.result-overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(18,8,32,.75);backdrop-filter:blur(3px)}
.result-overlay.show{display:flex}
.result-card{background:var(--bg2);border:3px solid var(--muted);border-radius:18px;padding:1.75rem 1.5rem 1.5rem;text-align:center;max-width:300px;width:86%;box-shadow:5px 5px 0 var(--muted);animation:popIn .3s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.result-icon{font-size:2.8rem;margin-bottom:.15rem}
.result-title{font-family:var(--font-heading);font-size:1.8rem}
.result-title.goal{color:var(--green)}
.result-title.saved{color:var(--red)}
.result-title.miss{color:var(--muted)}
.result-detail{font-size:.8rem;color:var(--ink2);margin-bottom:.25rem}
.result-score{font-family:var(--font-heading);font-size:1.1rem;color:var(--gold);margin-bottom:.75rem}
.result-next{display:inline-block;padding:.6rem 1.8rem;border:2px solid var(--outline);border-radius:10px;font-family:var(--font-heading);font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--gold);color:var(--outline);box-shadow:3px 3px 0 var(--outline)}
.result-next:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--outline)}

/* === GAME OVER === */
#screen-gameover{background:var(--bg)}
.go-card{width:100%;max-width:340px;background:var(--bg2);border:3px solid var(--muted);border-radius:18px;padding:1.5rem;text-align:center;box-shadow:5px 5px 0 var(--muted);animation:popIn .35s cubic-bezier(.175,.885,.32,1.275)}
.go-title{font-family:var(--font-heading);font-size:1.5rem;color:var(--gold);margin-bottom:.5rem}
.go-big-score{font-family:var(--font-heading);font-size:3.2rem;color:var(--ink);line-height:1}
.go-big-score .go-denom{font-size:1.4rem;color:var(--muted)}
.go-stats{display:flex;justify-content:center;gap:1.5rem;margin:.75rem 0}
.go-stat{text-align:center}
.go-stat-val{font-family:var(--font-heading);font-size:1.3rem;color:var(--gold)}
.go-stat-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.go-btns{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem}
.name-row{display:flex;gap:.4rem;margin:.4rem 0;align-items:center}
.name-row input{flex:1;padding:.45rem .65rem;border:2px solid var(--muted);border-radius:8px;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:.82rem;outline:none}
.name-row input:focus{border-color:var(--gold)}
.name-row .btn-save{padding:.45rem .9rem;border:2px solid var(--outline);border-radius:8px;background:var(--gold);color:var(--outline);font-family:var(--font-heading);font-size:.8rem;cursor:pointer;box-shadow:2px 2px 0 var(--outline)}
.name-row .btn-save:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--outline)}

/* === LEADERBOARD === */
#screen-leaderboard{background:var(--bg);padding:1rem}
.lb-inner{width:100%;max-width:360px;flex:1;display:flex;flex-direction:column;overflow:hidden;padding:.5rem 0}
.lb-title{font-family:var(--font-heading);font-size:1.6rem;text-align:center;color:var(--gold);margin-bottom:.5rem}
.lb-tabs{display:flex;gap:.4rem;margin-bottom:.75rem;justify-content:center}
.lb-tab{padding:.35rem .8rem;border:2px solid var(--muted);border-radius:8px;background:var(--bg);color:var(--muted);font-size:.75rem;font-family:var(--font-heading);letter-spacing:.04em;cursor:pointer;transition:all .15s}
.lb-tab.active{border-color:var(--gold);color:var(--gold);background:var(--bg2);box-shadow:0 0 10px var(--gold-dim)}
.lb-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.95rem}
.lb-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lb-list::-webkit-scrollbar{width:3px}
.lb-list::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}
.lb-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .65rem;border-bottom:1px solid rgba(255,255,255,.04);border-radius:6px}
.lb-item.highlight{background:rgba(255,221,51,.08);border:1px solid var(--gold-dim)}
.lb-rank{width:28px;text-align:center;font-family:var(--font-heading);font-size:1rem;color:var(--muted)}
.lb-rank.gold{color:var(--gold)}
.lb-rank.silver{color:#c0c8d0}
.lb-rank.bronze{color:#cd7f32}
.lb-name{flex:1;font-size:.85rem;color:var(--ink2)}
.lb-score{font-family:var(--font-heading);font-size:1.1rem;color:var(--gold)}
.lb-detail{font-size:.65rem;color:var(--muted)}
.lb-footer{display:flex;gap:.4rem;margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--muted)}
.lb-footer .btn{flex:1;padding:.5rem;font-size:.8rem}

/* === CONFETTI === */
.confetti-c{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:30;overflow:hidden}
.confetti-p{position:absolute;top:-20px;width:7px;height:7px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

@media(max-width:480px){
  .mode-grid{grid-template-columns:1fr;max-width:260px}
  .pick-card{flex:0 0 180px;height:min(300px,75vh)}
  .pick-card img.player-portrait{width:100px;height:120px}
  .settings-box,.go-card{padding:1.25rem}
  .result-card{padding:1.5rem 1rem}
}
@media(min-width:768px){
  #screen-game{max-width:800px;margin:0 auto}
}
</style>

<body>

<!-- MENU -->
<div id="screen-menu" class="screen active">
  <div class="menu-title">世界杯点球大战<span>⚡ PENALTY SHOOTOUT ⚡</span></div>
  <div class="menu-ball">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
      <path d="M32 8 Q20 20 18 32 Q16 44 32 56 Q48 44 46 32 Q44 20 32 8Z" fill="none" stroke="#444" stroke-width=".8"/>
      <path d="M24 16 Q20 28 22 36 Q24 44 32 48 L28 22Z" fill="none" stroke="#444" stroke-width=".5"/>
      <path d="M40 16 Q44 28 42 36 Q40 44 32 48 L36 22Z" fill="none" stroke="#444" stroke-width=".5"/>
      <polygon points="32,14 34,12 32,10 30,12" fill="#555"/>
    </svg>
  </div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="UI.showMode()">⚡ 开始游戏</button>
    <button class="btn btn-secondary" onclick="UI.showLeaderboard()">🏆 排行榜</button>
    <button class="btn btn-secondary" onclick="UI.showSettings()">⚙ 设置</button>
  </div>
</div>

<!-- MODE SELECT -->
<div id="screen-mode" class="screen">
  <div class="mode-title">选择你的角色</div>
  <div class="mode-sub">CHOOSE YOUR ROLE</div>
  <div class="mode-grid">
    <div class="mode-card" id="modeShooter" onclick="selectMode('shooter')">
      <div class="mode-icon">⚽</div>
      <div class="mode-name">射门球员</div>
      <div class="mode-desc">扮演传奇前锋<br>主罚点球破门</div>
    </div>
    <div class="mode-card" id="modeKeeper" onclick="selectMode('keeper')">
      <div class="mode-icon">🧤</div>
      <div class="mode-name">守门员</div>
      <div class="mode-desc">扮演传奇门将<br>飞身扑救点球</div>
    </div>
  </div>
  <button class="btn btn-primary mode-confirm" id="modeConfirmBtn" onclick="confirmMode()" style="opacity:.5;pointer-events:none">继续 →</button>
</div>

<!-- PLAYER SELECT -->
<div id="screen-pick" class="screen">
  <div class="pick-title" id="pickTitle">🔥 选择你的球员</div>
  <div class="pick-sub" id="pickSub">CHOOSE YOUR PLAYER</div>
  <div class="pick-carousel" id="pickCarousel"></div>
  <button class="btn btn-primary pick-confirm" onclick="confirmPick()">🔥 确认出战</button>
</div>

<!-- INTRO -->
<div id="screen-intro" class="screen">
  <canvas id="introCanvas" class="intro-canvas"></canvas>
</div>

<!-- SETTINGS -->
<div id="screen-settings" class="screen">
  <div class="settings-box">
    <div class="settings-title">⚙ 设置</div>
    <div class="setting-row">
      <span class="setting-label">射门轮数</span>
      <div class="setting-control">
        <button class="setting-btn" onclick="UI.adjRounds(-1)">−</button>
        <span class="setting-value" id="roundsDisplay">5</span>
        <button class="setting-btn" onclick="UI.adjRounds(1)">+</button>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">难度等级</span>
      <div class="diff-btns">

    });

/* ═══════════════════════════════════════════════
   DRAW PLAYER PORTRAIT (Canvas)
   ═══════════════════════════════════════════════ */
/* ── PERFECTED Japanese Shonen Anime Protagonist Style ── */
function drawPlayerPortrait(cvs,player,size){
  const s=size||120;cvs.width=s*2;cvs.height=s*2;
  const ctx=cvs.getContext('2d');ctx.scale(2,2);
  const cx=s/2,by=s-2;

  // === DRAMATIC ANIME BACKGROUND ===
  const bgGrad=ctx.createRadialGradient(cx,by-42,2,cx,by-42,s*.8);
  bgGrad.addColorStop(0,'#ffffee');bgGrad.addColorStop(.1,'#ffee44');
  bgGrad.addColorStop(.25,'#ff6600');bgGrad.addColorStop(.5,'#ee1100');
  bgGrad.addColorStop(.75,'#660000');bgGrad.addColorStop(1,'#0a0000');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,s,s);

  // Manga focus lines
  ctx.save();ctx.translate(cx,by-42);
  ctx.strokeStyle='rgba(255,255,200,.3)';ctx.lineWidth=1.5;ctx.lineCap='round';
  for(let i=0;i<56;i++){
    const a=i*Math.PI*2/56;
    const seed1=((i*11+7)%19)/19,seed2=((i*17+3)%29)/29;
    ctx.lineWidth = 1 + (seed1>0.65?1:0);
    ctx.beginPath();ctx.moveTo(Math.cos(a)*20,Math.sin(a)*20);ctx.lineTo(Math.cos(a)*(50+seed2*22),Math.sin(a)*(50+seed2*22));ctx.stroke();
  }
  ctx.restore();

  // Energy aura pulsing
  for(let layer=2;layer>=0;layer--){
    const pulse=Math.sin(Date.now()/220+layer)*2;
    const auraR=32+layer*7+pulse;
    const auraG=ctx.createRadialGradient(cx,by-44,5,cx,by-44,auraR);
    const alpha=(0.25-layer*0.06);
    auraG.addColorStop(0,'rgba(255,220,50,'+alpha+')');
    auraG.addColorStop(0.5,'rgba(255,80,0,'+(alpha*0.4)+')');
    auraG.addColorStop(1,'rgba(255,50,0,0)');
    ctx.fillStyle=auraG;ctx.beginPath();ctx.arc(cx,by-44,auraR,0,Math.PI*2);ctx.fill();
  }

  // === SHOULDERS / JERSEY (wider, more upper body visible) ===
  const jCol=player.jersey[0],jCol2=player.jersey[1]||null;
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(cx,by+8,36,7,0,0,Math.PI*2);ctx.fill();

  // Shoulders - broad shonen hero shoulders
  ctx.fillStyle=jCol;ctx.strokeStyle='#050000';ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.moveTo(cx-40,by);
  ctx.quadraticCurveTo(cx-36,by-22,cx-16,by-28);
  ctx.lineTo(cx-5,by-24);
  ctx.quadraticCurveTo(cx,by-23,cx+5,by-24);
  ctx.lineTo(cx+16,by-28);
  ctx.quadraticCurveTo(cx+36,by-22,cx+40,by);
  ctx.lineTo(cx+38,by+14);ctx.lineTo(cx-38,by+14);ctx.closePath();ctx.fill();ctx.stroke();

  // Jersey shadow
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.moveTo(cx+5,by-24);ctx.lineTo(cx+16,by-28);
  ctx.quadraticCurveTo(cx+36,by-22,cx+40,by);
  ctx.lineTo(cx+38,by+14);ctx.lineTo(cx+6,by+14);
  ctx.quadraticCurveTo(cx+8,by-6,cx+5,by-24);ctx.fill();

  // V-collar
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.moveTo(cx-7,by-24);ctx.lineTo(cx,by-14);ctx.lineTo(cx+7,by-24);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#050000';ctx.lineWidth=1.3;ctx.stroke();

  if(jCol2){
    ctx.fillStyle=jCol2;ctx.fillRect(cx-5,by-24,10,38);
    ctx.strokeStyle='#050000';ctx.lineWidth=1.5;ctx.strokeRect(cx-5,by-24,10,38);
  }
  // Jersey number
  ctx.save();ctx.font='bold 24px BigShoulders,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillText(player.num,cx,by+4);ctx.restore();

  // Shoulder muscle lines
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-26,by-10);ctx.quadraticCurveTo(cx-20,by,cx-14,by+8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+26,by-10);ctx.quadraticCurveTo(cx+20,by,cx+14,by+8);ctx.stroke();

  // === NECK (shorter, proportional) ===
  ctx.fillStyle=player.skin;ctx.strokeStyle='#050000';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-8,by-30);ctx.lineTo(cx-6,by-20);ctx.lineTo(cx+6,by-20);ctx.lineTo(cx+8,by-30);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(160,90,60,.22)';
  ctx.beginPath();ctx.moveTo(cx+2,by-22);ctx.lineTo(cx+6,by-20);ctx.lineTo(cx+8,by-30);ctx.lineTo(cx+4,by-26);ctx.closePath();ctx.fill();

  // === HEAD (smaller, narrower, classic shonen proportions) ===
  const headY=by-52;
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(cx+3,headY+3,12,17,0,0,Math.PI*2);ctx.fill();

  // FACE - narrower, natural sharp chin (not exaggerated)
  ctx.fillStyle=player.skin;ctx.strokeStyle='#050000';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-12,headY-6);
  ctx.bezierCurveTo(cx-15,headY-16,cx-8,headY-22,cx,headY-22);
  ctx.bezierCurveTo(cx+8,headY-22,cx+15,headY-16,cx+12,headY-6);
  ctx.bezierCurveTo(cx+14,headY+4,cx+10,headY+14,cx+5,headY+18);
  ctx.quadraticCurveTo(cx+2,headY+22,cx,headY+21);
  ctx.quadraticCurveTo(cx-2,headY+22,cx-5,headY+18);
  ctx.bezierCurveTo(cx-10,headY+14,cx-14,headY+4,cx-12,headY-6);
  ctx.closePath();ctx.fill();ctx.stroke();

  // Face shadow
  ctx.fillStyle='rgba(170,100,60,.22)';
  ctx.beginPath();
  ctx.moveTo(cx+4,headY-22);ctx.bezierCurveTo(cx+13,headY-18,cx+15,headY+0,cx+8,headY+12);
  ctx.bezierCurveTo(cx+5,headY+18,cx+3,headY+20,cx+2,headY+18);
  ctx.bezierCurveTo(cx+6,headY+8,cx+6,headY-8,cx+4,headY-18);ctx.fill();

  ctx.fillStyle='rgba(0,0,0,.06)';ctx.beginPath();ctx.ellipse(cx,headY+20,6,2,0,0,Math.PI*2);ctx.fill();

  // === EARS ===
  ctx.fillStyle=player.skin;ctx.strokeStyle='#050000';ctx.lineWidth=1.3;
  ctx.beginPath();ctx.ellipse(cx-12,headY+0,3,4.5,-.1,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx+12,headY+0,3,4.5,.1,0,Math.PI*2);ctx.fill();ctx.stroke();

  // === HAIR (super spiky, covers forehead - iconic anime hair!) ===
  const hairCol=player.hairColor;
  const pid=player.id;
  ctx.fillStyle=hairCol;ctx.strokeStyle='#050000';ctx.lineWidth=2;

  // Base hair - spiky with bangs covering forehead
  ctx.beginPath();
  ctx.moveTo(cx-12,headY-6);
  ctx.bezierCurveTo(cx-18,headY-18,cx-10,headY-32,cx,headY-34);
  ctx.bezierCurveTo(cx+10,headY-32,cx+18,headY-18,cx+12,headY-6);
  // Spiky bangs come down over forehead!
  ctx.lineTo(cx+10,headY);ctx.lineTo(cx+6,headY-6);ctx.lineTo(cx+2,headY+2);
  ctx.lineTo(cx-2,headY-4);ctx.lineTo(cx-6,headY);ctx.lineTo(cx-10,headY-4);
  ctx.closePath();ctx.fill();ctx.stroke();

  // Player-specific hair details
  if(pid==='messi'){
    // Messi - soft brown, swept bangs, beard hint
    ctx.fillStyle='rgba(70,40,15,.2)';
    ctx.beginPath();ctx.moveTo(cx-6,headY+14);ctx.bezierCurveTo(cx-4,headY+20,cx,headY+21,cx+6,headY+14);
    ctx.quadraticCurveTo(cx,headY+18,cx-6,headY+14);ctx.fill();
  }
  else if(pid==='ronaldo'){
    // CR7 - signature top spike
    ctx.beginPath();ctx.moveTo(cx-2,headY-30);ctx.quadraticCurveTo(cx+2,headY-42,cx+10,headY-36);
    ctx.quadraticCurveTo(cx+4,headY-30,cx+3,headY-24);ctx.closePath();ctx.fill();ctx.stroke();
  }
  else if(pid==='haaland'){
    // Haaland - long flowing side strands + red headband
    ctx.beginPath();ctx.moveTo(cx-14,headY-4);ctx.bezierCurveTo(cx-22,headY-2,cx-24,headY+8,cx-16,headY+12);
    ctx.bezierCurveTo(cx-14,headY+4,cx-12,headY,cx-10,headY-2);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+14,headY-4);ctx.bezierCurveTo(cx+22,headY-2,cx+24,headY+8,cx+16,headY+12);
    ctx.bezierCurveTo(cx+14,headY+4,cx+12,headY,cx+10,headY-2);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#dd1100';ctx.strokeStyle='#050000';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.ellipse(cx,headY-16,15,3,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  else if(pid==='neymar'){
    // Neymar - EXTRA CRAZY spikes + blonde streak
    ctx.beginPath();
    ctx.moveTo(cx-10,headY-2);ctx.lineTo(cx-12,headY-38);ctx.lineTo(cx-6,headY-20);
    ctx.lineTo(cx-2,headY-42);ctx.lineTo(cx+2,headY-22);ctx.lineTo(cx+5,headY-40);
    ctx.lineTo(cx+9,headY-24);ctx.lineTo(cx+12,headY-36);ctx.lineTo(cx+10,headY-2);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,230,100,.8)';
    ctx.beginPath();ctx.moveTo(cx-4,headY-28);ctx.lineTo(cx-1,headY-40);ctx.lineTo(cx+3,headY-26);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#050000';ctx.lineWidth=1;ctx.stroke();
  }
  else if(pid==='salah'){
    // Salah - beard
    ctx.fillStyle='rgba(25,12,5,.35)';
    ctx.beginPath();ctx.moveTo(cx-9,headY+8);ctx.bezierCurveTo(cx-8,headY+20,cx,headY+22,cx+9,headY+8);
    ctx.bezierCurveTo(cx+4,headY+16,cx,headY+18,cx-9,headY+8);ctx.fill();
  }

  // Hair highlight
  ctx.fillStyle=hairCol;ctx.strokeStyle='#050000';ctx.lineWidth=2;
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.moveTo(cx-10,headY-26);ctx.quadraticCurveTo(cx-5,headY-32,cx-2,headY-26);
  ctx.quadraticCurveTo(cx-6,headY-20,cx-10,headY-26);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+1,headY-28);ctx.quadraticCurveTo(cx+4,headY-32,cx+7,headY-24);
  ctx.quadraticCurveTo(cx+3,headY-20,cx+1,headY-28);ctx.fill();

  // === EYEBROWS (thick, sharp, angled - fierce!) ===
  ctx.fillStyle=hairCol;ctx.strokeStyle='#050000';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(cx-14,headY-6);ctx.lineTo(cx-4,headY-2);ctx.lineTo(cx-4,headY);
  ctx.lineTo(cx-14,headY-4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+14,headY-6);ctx.lineTo(cx+4,headY-2);ctx.lineTo(cx+4,headY);
  ctx.lineTo(cx+14,headY-4);ctx.closePath();ctx.fill();ctx.stroke();

  // === ALMOND-SHAPED ANIME EYES ===
  const eyeY=headY+4,eyeW=7,eyeH=8;
  const eyeColor={messi:'#3a7a2a',ronaldo:'#5a3515',mbappe:'#1a1a1a',kane:'#2a5a8a',
    haaland:'#2a4a6a',neymar:'#3a2515',lewandowski:'#2a4025',salah:'#1a2515',
    courtois:'#2a5a8a',donnarumma:'#1a1a1a',alisson:'#3a2010',ederson:'#1a2515',
    oblak:'#2a4a6a',neuer:'#2a5a3a'}[player.id]||'#2a4a7a';

  function drawAnimeEye(ex,ey){
    // Upper eyelid - sharp angled
    ctx.strokeStyle='#050000';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(ex-eyeW-1,ey-1);ctx.quadraticCurveTo(ex,ey-eyeH-2,ex+eyeW+1,ey-2);
    ctx.stroke();
    ctx.lineWidth=3.5;
    ctx.beginPath();ctx.moveTo(ex-eyeW-1,ey-1);ctx.lineTo(ex-eyeW+1,ey-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ex+eyeW+1,ey-2);ctx.lineTo(ex+eyeW-1,ey-3);ctx.stroke();

    // ALMOND eye white
    ctx.fillStyle='#fff';ctx.strokeStyle='#050000';ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(ex-eyeW,ey);
    ctx.quadraticCurveTo(ex-eyeW,ey-eyeH+.5,ex,ey-eyeH+.5);
    ctx.quadraticCurveTo(ex+eyeW,ey-eyeH+.5,ex+eyeW,ey);
    ctx.quadraticCurveTo(ex+eyeW,ey+eyeH-2,ex,ey+eyeH-2);
    ctx.quadraticCurveTo(ex-eyeW,ey+eyeH-2,ex-eyeW,ey);
    ctx.closePath();ctx.fill();ctx.stroke();

    // Upper lid shadow
    ctx.fillStyle='rgba(0,0,0,.1)';
    ctx.beginPath();ctx.moveTo(ex-eyeW+1,ey);ctx.quadraticCurveTo(ex,ey-eyeH+2,ex+eyeW-1,ey);
    ctx.quadraticCurveTo(ex+eyeW-2,ey-2,ex,ey-3);ctx.quadraticCurveTo(ex-eyeW+2,ey-2,ex-eyeW+1,ey);ctx.fill();

    // Iris
    const irR=5.5;
    const irG=ctx.createRadialGradient(ex,ey+2,.5,ex,ey+2,irR);
    irG.addColorStop(0,'#000');irG.addColorStop(.25,eyeColor);irG.addColorStop(.75,eyeColor);
    irG.addColorStop(1,shadeColor(eyeColor,-25));
    ctx.fillStyle=irG;ctx.beginPath();ctx.ellipse(ex,ey+2,irR,irR-1,0,0,Math.PI*2);ctx.fill();

    // Pupil
    ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(ex,ey+2,2,2.8,0,0,Math.PI*2);ctx.fill();

    // Sparkle highlights
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(ex-2,ey-1,2.2,1.8,-.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ex+2.5,ey+3,1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ex-3,ey+3,.5,0,Math.PI*2);ctx.fill();

    // Lower lash
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(ex-eyeW+2,ey+eyeH-3);ctx.quadraticCurveTo(ex,ey+eyeH-1,ex+eyeW-2,ey+eyeH-3);ctx.stroke();
  }
  drawAnimeEye(cx-8,eyeY);
  drawAnimeEye(cx+8,eyeY);

  // === NOSE (minimal anime nose) ===
  ctx.fillStyle='rgba(150,90,60,.3)';
  ctx.beginPath();ctx.ellipse(cx,headY+13,1,1.5,.1,0,Math.PI*2);ctx.fill();

  // === MOUTH (confident smirk) ===
  ctx.strokeStyle='#050000';ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-5,headY+17);ctx.quadraticCurveTo(cx,headY+20,cx+5,headY+17);ctx.stroke();
  ctx.fillStyle='#5a1010';
  ctx.beginPath();ctx.moveTo(cx-4,headY+17.5);ctx.quadraticCurveTo(cx,headY+19.5,cx+4,headY+17.5);
  ctx.quadraticCurveTo(cx,headY+18.2,cx-4,headY+17.5);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(cx-2.5,headY+17.5,5,1.5);

  // === FIGHTING SPIRIT FLAMES ===
  ctx.save();ctx.translate(cx+18,headY-14);
  const f=Math.sin(Date.now()/140)*2;
  ctx.fillStyle='#ff3300';ctx.strokeStyle='#050000';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,3);ctx.quadraticCurveTo(-5,-6,0,-14+f);ctx.quadraticCurveTo(2,-6,4,-9);
  ctx.quadraticCurveTo(7,-1,3,6);ctx.quadraticCurveTo(0,8,-3,6);ctx.quadraticCurveTo(-5,-1,0,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffaa00';
  ctx.beginPath();ctx.moveTo(0,1);ctx.quadraticCurveTo(-3,-4,0,-9+f);ctx.quadraticCurveTo(1,-4,3,-5);
  ctx.quadraticCurveTo(4,0,1,4);ctx.fill();
  ctx.fillStyle='#ffee00';
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-1,-3,0,-6+f);ctx.quadraticCurveTo(1,-3,1,-3);
  ctx.quadraticCurveTo(2,0,0,1);ctx.fill();
  ctx.restore();

  // Lightning spark
  ctx.save();ctx.translate(cx-16,headY-26);
  ctx.strokeStyle='#ffff00';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(2,-3);ctx.lineTo(1,-3);ctx.lineTo(3,-8);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,100,.4)';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();

  ctx.setTransform(1,0,0,1,0,0);
}

// Helper to darken/lighten colors
function shadeColor(hex, percent){
  const num=parseInt(hex.replace('#',''),16);
  const amt=Math.round(2.55*percent);
  const R=Math.max(0,Math.min(255,(num>>16)+amt));
  const G=Math.max(0,Math.min(255,((num>>8)&0x00FF)+amt));
  const B=Math.max(0,Math.min(255,(num&0x0000FF)+amt));
  return '#'+(0x1000000+R*0x10000+G*0x100+B).toString(16).slice(1);
}

function renderPlayerCarousel(){

  list.forEach((p,i)=>{

    const img=document.createElement('img');img.className='player-portrait';img.src='./images/players/'+p.id+'.png';img.alt=p.name;img.width=120;img.height=140;
    card.appendChild(img);

    const nm=document.createElement('div');nm.className='pick-name';nm.textContent=p.name;card.appendChild(nm);
    const ne=document.createElement('div');ne.className='pick-name-en';ne.textContent=p.en;card.appendChild(ne);
    const ct=document.createElement('div');ct.className='pick-country';ct.textContent=p.country;card.appendChild(ct);

    const st=document.createElement('div');st.className='pick-style-tag';st.textContent='✦ '+p.styleName;
    card.appendChild(st);

    const sw=document.createElement('div');sw.className='pick-stats';
    const statLabels = isGK ? {ref:'反应',reach:'臂展',pos:'站位',psy:'心理'} : {pwr:'力量',acc:'精准',cv:'弧线',cmp:'心理'};
    const statColors = isGK ? {ref:'#ff4422',reach:'#4488ff',pos:'#33dd66',psy:'#ffdd33'} : {pwr:'#ff4422',acc:'#33dd66',cv:'#4488ff',cmp:'#ffdd33'};
    Object.keys(statLabels).forEach(k=>{
      const r=document.createElement('div');r.className='pick-stat-row';
      const lb=document.createElement('span');lb.className='pick-stat-label';lb.textContent=statLabels[k];
      const bar=document.createElement('div');bar.className='pick-stat-bar';

      vl.textContent=p.stats[k];

    });

    const nb=document.createElement('div');nb.className='pick-number';nb.textContent='#'+p.num;

/* ═══════════════════════════════════════════════
   INTRO ANIMATION
   ═══════════════════════════════════════════════ */
let introAnimating=false;
function showIntroAnimation(){
  UI.showScreen('screen-intro');
  const cvs=document.getElementById('introCanvas');
  const ctx=cvs.getContext('2d');
  let W=cvs.parentElement.clientWidth,H=cvs.parentElement.clientHeight;
  cvs.width=W;cvs.height=H;

  const start=performance.now(),duration=3500;
  const particles=[];
  for(let i=0;i<60;i++)particles.push({x:Math.random()*W,y:Math.random()*H*.5,s:1+Math.random()*3,a:.3+Math.random()*.4,v:.2+Math.random()*.5,ph:Math.random()*Math.PI*2});

  function frame(now){
    if(!introAnimating)return;
    const t=Math.min((now-start)/duration,1);
    const nw=cvs.parentElement.clientWidth,nh=cvs.parentElement.clientHeight;
    if(nw!==W||nh!==H){W=nw;H=nh;cvs.width=W;cvs.height=H}
    ctx.clearRect(0,0,W,H);

    // Sky
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#0a0518');sky.addColorStop(.3,'#1a0f30');sky.addColorStop(.6,'#1a2018');sky.addColorStop(1,'#0a2a14');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

    // Lights
    for(let i=0;i<3;i++){
      const lx=W*(.15+i*.35);
      ctx.fillStyle='rgba(255,221,68,'+(.05+.05*Math.sin(now/1000+i))+')';
      ctx.shadowColor='rgba(255,221,68,.3)';ctx.shadowBlur=40;
      ctx.beginPath();ctx.arc(lx,10,8,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;

    // Crowd
    for(let i=0;i<40;i++){
      const cx=Math.random()*W,cy=8+Math.random()*50;
      ctx.fillStyle=`hsla(${Math.random()*360},70%,50%,${.15+.1*Math.sin(now/500+i)})`;
      ctx.beginPath();ctx.arc(cx,cy,3+Math.random()*4,0,Math.PI*2);ctx.fill();
    }

    // Speed lines
    ctx.strokeStyle='rgba(255,221,68,'+(.02+.03*(1-t))+')';ctx.lineWidth=1;
    for(let i=0;i<20;i++){
      const ly=(H/3)+i*(H/40);
      ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly+Math.sin(i+now/300)*30);ctx.stroke();
    }

    // Player silhouette
    const pScale=Math.min(t*1.8,1);
    const pY=H*.4;
    ctx.save();ctx.translate(W/2,pY);ctx.scale(pScale,pScale);ctx.globalAlpha=Math.min(t*3,1);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,40,40,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a1040';ctx.strokeStyle='rgba(255,221,68,.3)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-20,-30);ctx.quadraticCurveTo(-15,-55,0,-60);
    ctx.quadraticCurveTo(15,-55,20,-30);ctx.lineTo(25,30);ctx.lineTo(-25,30);ctx.closePath();ctx.fill();ctx.stroke();

    const jt=Math.max(0,(t-.3)/.4);
    if(jt>0){
      const jc=selectedPlayer.jersey[0];
      ctx.fillStyle=jc;ctx.globalAlpha=jt;
      ctx.beginPath();
      ctx.moveTo(-15,-25);ctx.quadraticCurveTo(-12,-40,0,-42);
      ctx.quadraticCurveTo(12,-40,15,-25);ctx.lineTo(18,25);ctx.lineTo(-18,25);ctx.closePath();ctx.fill();
    }
    ctx.globalAlpha=1;ctx.restore();

    // Text
    const tx=Math.max(0,(t-.2)/.5);
    if(tx>0){
      ctx.save();ctx.globalAlpha=Math.min(tx*2,1);ctx.textAlign='center';
      ctx.font='bold '+Math.round(clamp(28,48,W/10))+'px BigShoulders,sans-serif';
      ctx.fillStyle='#ffdd33';ctx.shadowColor='rgba(255,221,51,.4)';ctx.shadowBlur=20;
      ctx.fillText('PENALTY',W/2,H*.65);
      const ntx=Math.max(0,(t-.45)/.4);
      if(ntx>0){
        ctx.globalAlpha=Math.min(ntx*2,1);
        ctx.font='bold '+Math.round(clamp(20,36,W/12))+'px BigShoulders,sans-serif';
        ctx.fillStyle='#fff';ctx.shadowColor='rgba(255,255,255,.2)';ctx.shadowBlur=10;
        ctx.fillText(selectedPlayer.name+' · #'+selectedPlayer.num,W/2,H*.78);
        ctx.font=Math.round(clamp(12,20,W/20))+'px sans-serif';
        ctx.fillStyle='rgba(255,255,255,.5)';ctx.shadowBlur=0;
        ctx.fillText(selectedPlayer.country,W/2,H*.87);
      }
      ctx.shadowBlur=0;ctx.restore();
    }

    // Particles
    const pt=now/1000;
    particles.forEach(p=>{
      p.y+=p.v*Math.sin(pt+p.ph)*.5;
      const a=p.a*(.5+.5*Math.sin(pt*p.v+p.ph));
      ctx.fillStyle='rgba(255,221,68,'+a+')';
      ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();
    });

    // GO! flash
    if(t>.85){
      const ft=(t-.85)/.15;
      ctx.save();ctx.globalAlpha=ft;
      ctx.fillStyle='rgba(255,221,51,'+(ft*.15)+')';ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=Math.min(ft*2,1);
      ctx.font='bold '+Math.round(clamp(36,64,W/8))+'px BigShoulders,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#ffdd33';ctx.shadowColor='rgba(255,221,51,.6)';ctx.shadowBlur=40;
      ctx.fillText('⚡ GO! ⚡',W/2,H/2);
      ctx.shadowBlur=0;ctx.restore();
    }

    if(t<1)requestAnimationFrame(frame);
    else{
      introAnimating=false;
      let fadeAlpha=0;
      function fadeOut(){fadeAlpha+=.08;if(fadeAlpha<1){ctx.fillStyle='rgba(0,0,0,'+fadeAlpha+')';ctx.fillRect(0,0,W,H);requestAnimationFrame(fadeOut)}else Game.startReal()}
      fadeOut();
    }
  }
  introAnimating=true;requestAnimationFrame(frame);
}

function clamp(min,v,max){return Math.max(min,Math.min(max,v))}

/* ═══════════════════════════════════════════════
   GAME ENGINE

const DIR={TL:{l:'左上',cx:.17,cy:.08},TC:{l:'中上',cx:.50,cy:.08},TR:{l:'右上',cx:.83,cy:.08},BL:{l:'左下',cx:.17,cy:.25},BC:{l:'中下',cx:.50,cy:.25},BR:{l:'右下',cx:.83,cy:.25}};
const DK=Object.keys(DIR);

let G={state:'idle',round:0,score:0,aimDir:null,keeperDir:null,power:0,animating:false,streak:0,bestStreak:0,chargeTimer:null,chargeStart:0};

const cvs=document.getElementById('gameCanvas'),ctx=cvs.getContext('2d');
let W,H,dpr;

function resize(){
  dpr=window.devicePixelRatio||1;const w=cvs.parentElement;
  W=w.clientWidth;H=w.clientHeight;
  cvs.width=W*dpr;cvs.height=H*dpr;
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawField();
}

function getZones(){
  const gw=.60,gh=.30,gx=(1-gw)/2,gy=.10,cw=gw/3,ch=gh/2;
  return DK.map((k,i)=>({key:k,x:gx+(i%3)*cw,y:gy+Math.floor(i/3)*ch,w:cw,h:ch,cx:gx+(i%3)*cw+cw/2,cy:gy+Math.floor(i/3)*ch+ch/2}));
}

/* ── DRAW FIELD ── */
function drawField(){
  ctx.clearRect(0,0,W,H);
  // Dramatic anime stadium sky - fiery sunset
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a0540');sky.addColorStop(.12,'#4a1060');sky.addColorStop(.25,'#cc2200');
  sky.addColorStop(.38,'#ff6600');sky.addColorStop(.5,'#ffaa00');sky.addColorStop(.6,'#1a5520');
  sky.addColorStop(1,'#0a2a10');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // Stadium lights glow
  const lg=ctx.createRadialGradient(W/2,H*.3,10,W/2,H*.3,W*.5);
  lg.addColorStop(0,'rgba(255,240,180,.12)');lg.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  drawCrowd();drawPitch();drawGoal();drawZones();drawKeeper();
  const bx=W*.5,by=H*.82;
  if(G.state!=='shooting'||!shotAnim)drawBall(bx,by,14);
  if(G.aimDir&&G.state!=='shooting')drawAim(bx,by);
  drawComicFX();
  drawImpactFX();
  const vg=ctx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,H*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(G.state==='aiming'){
    ctx.save();ctx.textAlign='center';
    ctx.font='bold '+clamp(14,22,W/25)+'px BigShoulders,sans-serif';
    ctx.fillStyle='rgba(255,221,34,'+(.08+.05*Math.sin(Date.now()/500))+')';
    ctx.fillText('⚡ 狙いを定めろ！ ⚡',W/2,H*.06);
    ctx.restore();
  }
}

/* ── Crowd ── */
let crowdC=[];
function initCrowd(){crowdC=[];const p=['#ff4466','#ff8833','#ffdd44','#44dd66','#4488ff','#dd44ff','#ff66aa','#66ffcc'];for(let i=0;i<80;i++)crowdC.push(p[i%p.length])}
initCrowd();
function drawCrowd(){
  const baseY=H*.01,standH=H*.12,cols=30,rows=4;
  ctx.fillStyle='#1a0840';ctx.strokeStyle='#3a2060';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(W*.02,baseY,W*.96,standH+8,6);ctx.fill();ctx.stroke();
  const cw=(W-W*.06)/cols,rh=standH/(rows+1);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const idx=(r*cols+c)%crowdC.length,x=W*.03+c*cw+cw/2,y=baseY+6+rh/2+r*rh,sz=4+Math.random()*3;
    ctx.fillStyle=crowdC[idx];ctx.beginPath();ctx.arc(x,y+2,sz,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e8c8a0';ctx.beginPath();ctx.arc(x,y-3,sz*.5,0,Math.PI*2);ctx.fill();
  }
  for(let i=0;i<4;i++){
    const bx=W*(.1+i*.24);ctx.fillStyle=['#ff4466','#ffdd44','#4488ff','#44dd66'][i%4];ctx.strokeStyle='#2a1a0a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(bx,baseY+4,cw*3,standH*.55,3);ctx.fill();ctx.stroke();
  }
  for(let i=0;i<3;i++){
    const fx=W*(.15+i*.35);
    ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fx,baseY+standH+10);ctx.lineTo(fx,baseY-6);ctx.stroke();
    ctx.fillStyle='#ffdd88';ctx.shadowColor='rgba(255,221,68,.3)';ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(fx,baseY-4,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
}

/* ── Pitch ── */
function drawPitch(){
  const topY=H*.22,botY=H,topW=W*.75,botW=W*1.1;
  const gr=ctx.createLinearGradient(0,topY,0,botY);
  gr.addColorStop(0,'#186a30');gr.addColorStop(.5,'#229944');gr.addColorStop(1,'#186a30');
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.moveTo((W-topW)/2,topY);ctx.lineTo((W+topW)/2,topY);ctx.lineTo((W+botW)/2,botY);ctx.lineTo((W-botW)/2,botY);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=2;
  for(let y=topY+20;y<botY;y+=35){
    const t=(y-topY)/(botY-topY),hw=(topW/2)*(1-t)+(botW/2)*t;
    ctx.beginPath();ctx.moveTo(W/2-hw,y);ctx.lineTo(W/2+hw,y);ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.setLineDash([6,8]);
  const paT=H*.35,paB=H*.70,paW=W*.5,paW2=W*.15;
  ctx.beginPath();ctx.moveTo((W-paW)/2,paT);ctx.lineTo((W-paW2)/2,paB);ctx.stroke();
  ctx.beginPath();ctx.moveTo((W+paW)/2,paT);ctx.lineTo((W+paW2)/2,paB);ctx.stroke();
  ctx.beginPath();ctx.moveTo((W-paW2)/2,paB);ctx.lineTo((W+paW2)/2,paB);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(W/2,H*.82,4,0,Math.PI*2);ctx.fill();
}

/* ── Goal ── */
function drawGoal(){
  const gx=W*.20,gy=H*.10,gw=W*.60,gh=H*.30;
  ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(gx,gy,gw,gh);
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=.5;
  for(let r=0;r<=7;r++){ctx.beginPath();ctx.moveTo(gx,gy+r*gh/7);ctx.lineTo(gx+gw,gy+r*gh/7);ctx.stroke()}
  for(let c=0;c<=10;c++){ctx.beginPath();ctx.moveTo(gx+c*gw/10,gy);ctx.lineTo(gx+c*gw/10,gy+gh);ctx.stroke()}
  ctx.shadowColor='rgba(255,255,255,.1)';ctx.shadowBlur=8;
  ctx.strokeStyle='#f0f0f0';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy+gh);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gx+gw,gy);ctx.lineTo(gx+gw,gy+gh);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+gw,gy);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gx,gy+gh);ctx.lineTo(gx+gw,gy+gh);ctx.stroke();
}

/* ── Zones ── */
function drawZones(){
  // Don't show zones in keeper mode
  if(selectedMode==='keeper')return;
  if(G.state==='idle'||G.state==='shooting')return;
  const zs=getZones(),showL=(G.state==='aiming');
  zs.forEach(z=>{
    const rx=z.x*W,ry=z.y*H,rw=z.w*W,rh=z.h*H;
    ctx.strokeStyle='rgba(255,221,68,.1)';ctx.lineWidth=1;ctx.setLineDash([4,6]);
    ctx.strokeRect(rx,ry,rw,rh);ctx.setLineDash([]);
    if(showL){ctx.fillStyle='rgba(255,221,68,.2)';ctx.font=Math.round(12*(W/400))+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(DIR[z.key].l,rx+rw/2,ry+rh/2)}
  });
  if(G.aimDir&&(G.state==='powering'||G.state==='charging')){
    const s=zs.find(z=>z.key===G.aimDir);
    if(s){
      const rx=s.x*W,ry=s.y*H,rw=s.w*W,rh=s.h*H;
      ctx.fillStyle='rgba(255,221,68,.18)';ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,4);ctx.fill();
      ctx.strokeStyle='rgba(255,221,68,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,4);ctx.stroke();
    }
  }
}

/* ── Keeper Images Preload ── */
const keeperImages={};
function preloadKeeperImages(){
  const ids=['courtois','donnarumma','alisson','ederson','oblak','neuer'];
  ids.forEach(id=>{const img=new Image();img.src='./images/keepers/'+id+'.png';keeperImages[id]=img;});
}
preloadKeeperImages();

/* ── Keeper (Anime Image Style In-Game) ── */
function drawKeeper(){
  const gx=W*.20,gy=H*.10,gw=W*.60,gh=H*.30,kx=gx+gw/2,ky=gy+gh*.6;
  const kd=G.keeperDir;let dx=0,dy=0;
  const kdValid = kd && DIR[kd];
  let diveT = 0;
  if(G.state==='shooting'&&shotAnim){
    const t=shotAnim.t;diveT=t;
    if(kdValid){const d=DIR[kd],tx=gx+d.cx*gw,ty=gy+d.cy*gh;dx=(tx-kx)*Math.min(t*3,1)*.7;dy=(ty-ky)*Math.min(t*2,1)*.5-8*Math.min(t*2,1)}
  }else if(kdValid&&G.state!=='aiming'&&G.state!=='powering'&&G.state!=='charging'){
    const d=DIR[kd];dx=(gx+d.cx*gw-kx)*.7;dy=-8;
  }
  if(selectedMode!=='keeper'&&!kd&&G.state==='idle')return;

  // Keeper afterimage trail during dive (simplified for img rendering)
  if(G.state==='shooting'&&kdValid&&diveT>0&&diveT<.6){
    const gkId=(selectedMode==='keeper'&&selectedPlayer&&keeperImages[selectedPlayer.id])?selectedPlayer.id:'courtois';
    const kImg=keeperImages[gkId];
    if(kImg&&kImg.complete&&kImg.naturalWidth>0){
      const s=Math.min(W*.14,H*.14);
      const w=s,h=s;
      for(let i=3;i>=1;i--){
        const tr=dx*(1-i*.18),td=dy*(1-i*.18);
        ctx.save();ctx.translate(kx+tr,ky+td);
        ctx.globalAlpha=(1-diveT/.6)*(.15-i*.04);
        if(Math.abs(dx)>5){const rot=dx>0?0.35:-0.35;ctx.rotate(rot);}
        ctx.drawImage(kImg,-w/2,-h/2-8,w,h);
        ctx.restore();
      }
    }
  }

  // INTENSE Speed lines behind diving keeper (manga action lines!)
  if(G.state==='shooting'&&kdValid&&diveT>0&&diveT<.8){
    ctx.save();ctx.translate(kx+dx,ky+dy);
    ctx.strokeStyle='rgba(255,255,180,'+(0.4*(1-diveT/.8))+')';ctx.lineWidth=3;ctx.lineCap='round';
    const dir=dx>0?1:-1;
    for(let i=0;i<10;i++){
      const ly=-20+i*5;
      const len=30+Math.random()*20;
      ctx.lineWidth=1.5+Math.random()*2;
      ctx.beginPath();ctx.moveTo(-dir*18,ly);ctx.lineTo(-dir*(18+len),ly+(Math.random()-.5)*6);ctx.stroke();
    }
    // Impact burst lines
    ctx.strokeStyle='rgba(255,255,255,'+(0.3*(1-diveT/.8))+')';ctx.lineWidth=2;
    for(let i=0;i<8;i++){
      const ang=Math.PI+(i-3.5)*.3;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*25,Math.sin(ang)*25);ctx.stroke();
    }
    ctx.restore();
  }

  // Fighting spirit aura around keeper (when in keeper mode)
  if(selectedMode==='keeper'&&G.state!=='idle'){
    ctx.save();ctx.translate(kx+dx,ky+dy);
    const auraPulse=Math.sin(Date.now()/200)*3;
    for(let l=2;l>=0;l--){
      const aG=ctx.createRadialGradient(0,-10,5,0,-10,35+l*8+auraPulse);
      const a=.15-l*.04;
      aG.addColorStop(0,'rgba(100,200,255,'+a+')');aG.addColorStop(1,'rgba(100,200,255,0)');
      ctx.fillStyle=aG;ctx.beginPath();ctx.arc(0,-10,35+l*8+auraPulse,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();ctx.translate(kx+dx,ky+dy);

  // Shadow (bigger, softer)
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,28,20,5,0,0,Math.PI*2);ctx.fill();

  // Draw keeper anime image
  const gkId=(selectedMode==='keeper'&&selectedPlayer&&keeperImages[selectedPlayer.id])?selectedPlayer.id:'courtois';
  const keeperImg=keeperImages[gkId];
  if(keeperImg&&keeperImg.complete&&keeperImg.naturalWidth>0){
    const s=Math.min(W*.14,H*.14);
    const w=s,h=s;
    // Rotate when diving
    if(Math.abs(dx)>5){const rot=dx>0?0.35:-0.35;ctx.rotate(rot);}
    ctx.drawImage(keeperImg,-w/2,-h/2-8,w,h);
  } else {
    // Fallback: simple colored circle if image not loaded yet
    ctx.fillStyle='#ff4422';ctx.beginPath();ctx.arc(0,-10,20,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

/* ── Ball ── */
function drawBall(x,y,r){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(x,y+r+4,r*.85,r*.25,0,0,Math.PI*2);ctx.fill();
  var bg=ctx.createRadialGradient(x-r*.25,y-r*.25,r*.05,x,y,r);
  bg.addColorStop(0,'#fff');bg.addColorStop(.6,'#eee');bg.addColorStop(1,'#bbb');
  ctx.fillStyle=bg;ctx.strokeStyle='#2a1a0a';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=.7;
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5-Math.PI/2,px=x+Math.cos(a)*r*.45,py=y+Math.sin(a)*r*.45;
    ctx.beginPath();
    for(let j=0;j<5;j++){const aj=j*Math.PI*2/5+a,d=r*.2;const sx=px+Math.cos(aj)*d,sy=py+Math.sin(aj)*d;j===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy)}
    ctx.closePath();ctx.stroke();
  }
  ctx.restore();
}

/* ── Aim ── */
function drawAim(fx,fy){
  const zs=getZones(),t=zs.find(z=>z.key===G.aimDir);if(!t)return;
  const tx=t.cx*W,ty=t.cy*H;
  ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,221,68,.12)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,221,68,.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(tx,ty,8,0,Math.PI*2);ctx.stroke();
}

/* ── Comic FX ── */
let stars=[];
function initStars(){stars=[];for(let i=0;i<10;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.3,sz:3+Math.random()*7,a:.2+Math.random()*.4,sp:.5+Math.random(),ph:Math.random()*Math.PI*2})}
initStars();
function drawComicFX(){
  const n=Date.now()/1000;
  stars.forEach(s=>{
    const a=s.a*(.5+.5*Math.sin(n*s.sp+s.ph));
    ctx.fillStyle='rgba(255,255,200,'+a+')';
    ctx.beginPath();
    for(let i=0;i<4;i++){const ang=s.ph+i*Math.PI/2;const px=s.x+Math.cos(ang)*s.sz,py=s.y+Math.sin(ang)*s.sz;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
    ctx.closePath();ctx.fill();
  });
  if(G.state==='aiming'){
    ctx.strokeStyle='rgba(255,221,68,'+(.04+.03*Math.sin(n))+')';ctx.lineWidth=2;ctx.lineCap='round';
    for(let i=0;i<6;i++){const ang=n*.5+i*Math.PI/3;ctx.beginPath();ctx.moveTo(W/2+Math.cos(ang)*W*.35,H*.22+Math.sin(ang)*H*.06);ctx.lineTo(W/2+Math.cos(ang)*W*.4,H*.22+Math.sin(ang)*H*.06);ctx.stroke()}
  }
}

/* ── Manga Impact Text Effect ── */
function triggerImpact(text, color, subText){
  impactFX = { text, color, subText: subText||'', t: 0, start: performance.now(), dur: 800 };
}
function drawImpactFX(){
  if(!impactFX) return;
  const elapsed = performance.now() - impactFX.start;
  const t = Math.min(elapsed / impactFX.dur, 1);
  impactFX.t = t;
  if(t >= 1){ impactFX = null; return; }

  const cx = W/2, cy = H*.28;
  const scale = t < .2 ? t/.2 : (t>.7 ? 1-(t-.7)/.3*.15 : 1);
  const alpha = t > .7 ? 1-(t-.7)/.3 : 1;
  const shake = t < .3 ? (Math.random()-.5)*8*(1-t/.3) : 0;
  const rot = t < .2 ? (.5-t/.2)*.15 : 0;

  ctx.save();
  ctx.translate(cx+shake, cy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  // Background flash burst
  if(t < .4){
    const burst = ctx.createRadialGradient(0,0,5,0,0,W*.3);
    burst.addColorStop(0,'rgba(255,255,255,'+(.6*(1-t/.4))+')');
    burst.addColorStop(.3,'rgba(255,200,50,'+(.3*(1-t/.4))+')');
    burst.addColorStop(1,'rgba(255,200,50,0)');
    ctx.fillStyle = burst;
    ctx.fillRect(-W*.3,-H*.3,W*.6,H*.6);
  }

  // Speed lines radiating from text
  ctx.strokeStyle='rgba(255,255,200,'+(alpha*.4)+')';ctx.lineWidth=3;ctx.lineCap='round';
  for(let i=0;i<16;i++){
    const a=i*Math.PI*2/16+t*.5;
    const r1=40+Math.random()*10,r2=90+Math.random()*40;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke();
  }

  // Text shadow/black outline (manga style - thick black border)
  const fs = clamp(36,64,W*.14);
  ctx.font='bold '+fs+'px BigShoulders,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.lineJoin='round';
  ctx.strokeText(impactFX.text,0,0);
  // White outer stroke
  ctx.lineWidth=4;ctx.strokeStyle='#fff';
  ctx.strokeText(impactFX.text,0,0);
  // Fill
  ctx.fillStyle=impactFX.color;
  ctx.fillText(impactFX.text,0,0);

  // Sub text
  if(impactFX.subText){
    const fs2=clamp(14,20,W*.05);
    ctx.font='bold '+fs2+'px BigShoulders,sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='#000';
    ctx.strokeText(impactFX.subText,0,fs*.65);
    ctx.fillStyle='#fff';
    ctx.fillText(impactFX.subText,0,fs*.65);
  }

  ctx.restore();
}

/* ── Sound Effects (Web Audio API - procedural) ── */
const SFX={
  ctx:null,
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},
  play(type){
    try{
      this.init();
      const ac=this.ctx,t=ac.currentTime;
      if(type==='cheer') this._cheer(ac,t);
      else if(type==='boo') this._boo(ac,t);
      else if(type==='kick') this._kick(ac,t);
      else if(type==='whistle') this._whistle(ac,t);
    }catch(e){}
  },
  _noise(ac,t,dur,freqStart,freqEnd,vol){
    const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const p=i/d.length;
      const env=Math.sin(p*Math.PI)*vol;
      d[i]=(Math.random()*2-1)*env;
    }
    const src=ac.createBufferSource();src.buffer=buf;
    const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+dur);
    const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=.5;
    f.frequency.setValueAtTime(freqStart,t);f.frequency.linearRampToValueAtTime(freqEnd,t+dur);
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start(t);src.stop(t+dur);
    return src;
  },
  _cheer(ac,t){
    // Layered crowd cheer - multiple noise bursts at different frequencies
    for(let i=0;i<4;i++){
      const delay=i*.08;
      const dur=1.8+Math.random()*.5;
      const freq=800+Math.random()*2000;
      this._noise(ac,t+delay,dur,freq,freq+800,.08+Math.random()*.06);
    }
    // Add some higher pitched "woohoo" layers
    for(let i=0;i<3;i++){
      const delay=.15+i*.12;
      const dur=1.2+Math.random()*.3;
      this._noise(ac,t+delay,dur,2000+Math.random()*1500,2500+Math.random()*1000,.05+Math.random()*.04);
    }
  },
  _boo(ac,t){
    // Low rumbling boos - low frequency noise layers
    for(let i=0;i<3;i++){
      const delay=i*.1;
      const dur=1.5+Math.random()*.4;
      this._noise(ac,t+delay,dur,200+Math.random()*200,150,.1+Math.random()*.05);
    }
    // Descending tone for dramatic disappointment
    const osc=ac.createOscillator();osc.type='sawtooth';
    osc.frequency.setValueAtTime(180,t);osc.frequency.linearRampToValueAtTime(80,t+1.2);
    const g=ac.createGain();g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.06,t+.05);g.gain.linearRampToValueAtTime(0,t+1.2);
    osc.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+1.3);
  },
  _kick(ac,t){
    // Short impact thud
    const osc=ac.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(150,t);osc.frequency.exponentialRampToValueAtTime(40,t+.1);
    const g=ac.createGain();g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);
    osc.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+.2);
    // Click layer
    const o2=ac.createOscillator();o2.type='triangle';
    o2.frequency.setValueAtTime(800,t);o2.frequency.exponentialRampToValueAtTime(200,t+.03);
    const g2=ac.createGain();g2.gain.setValueAtTime(.15,t);g2.gain.exponentialRampToValueAtTime(.001,t+.06);
    o2.connect(g2);g2.connect(ac.destination);o2.start(t);o2.stop(t+.1);
  },
  _whistle(ac,t){
    // Short referee whistle
    const osc=ac.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(2800,t);osc.frequency.setValueAtTime(3200,t+.1);osc.frequency.setValueAtTime(2800,t+.2);
    const g=ac.createGain();g.gain.setValueAtTime(.12,t);g.gain.setValueAtTime(.12,t+.15);g.gain.linearRampToValueAtTime(0,t+.25);
    osc.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+.3);
  }
};

function triggerImpactForResult(result){
  const isGK = selectedMode === 'keeper';
  if(result==='goal'||result==='near'){
    triggerImpact('ゴール!', '#ff2200', isGK?'失点…':'決まった!');
    // Shooter scores = cheer, Keeper concedes = boo
    SFX.play(isGK?'boo':'cheer');
  }else if(result==='saved'){
    triggerImpact('セーブ!', '#00ddff', isGK?'完璧!':'防がれた!');
    // Keeper saves = cheer, Shooter denied = boo
    SFX.play(isGK?'cheer':'boo');
  }else{
    triggerImpact('ハズレ!', '#888', '枠外!');
    // Miss = light boo
    SFX.play('boo');
  }
}

/* ═══════════════════════════════════════════════
   SHOOTER MODE
   ═══════════════════════════════════════════════ */
let shotAnim=null;
let impactFX=null; // manga-style impact text effect
function animateShot(result){
  G.state='shooting';G.animating=true;
  SFX.play('kick');
  document.getElementById('phaseHint').classList.remove('show');
  document.getElementById('chargeBarWrap').classList.remove('show');
  document.getElementById('powerUI').classList.remove('show');

  const fromX=W/2,fromY=H*.82,zs=getZones(),t=zs.find(z=>z.key===G.aimDir);
  const toX=t?t.cx*W:W/2,toY=t?t.cy*H:H*.2;

  // Set up shotAnim so keeper animates and default ball isn't drawn
  shotAnim = { t: 0 };

  const start=performance.now(),dur=500;

  function frame(now){
    const raw=Math.min((now-start)/dur,1),et=1-Math.pow(1-raw,2);
    shotAnim.t = raw;
    drawField();
    if(result==='goal'){drawTraj(fromX,fromY,toX+(Math.random()-.5)*8,toY+(Math.random()-.5)*8,et)}
    else if(result==='saved'){
      const kx=W/2,ky=H*.3,dx=kx+(Math.random()-.5)*50,dy=ky+25;
      if(et<.55)drawTraj(fromX,fromY,kx,ky,et/.55)
      else{const p=(et-.55)/.45;drawBall(kx+(dx-kx)*p,ky+(dy-ky)*p,8+p*4)}
    }else{
      let mx,my;
      if(G.power>80){mx=toX+(Math.random()-.5)*25;my=-20}
      else{const sd=Math.random()>.5?1:-1;mx=toX+sd*50;my=toY+(Math.random()-.5)*20}
      drawTraj(fromX,fromY,mx,my,et);
    }
    if(raw<1)requestAnimationFrame(frame);
    else{G.animating=false;shotAnim=null;triggerImpactForResult(result);setTimeout(()=>showResult(result),400)}
  }
  requestAnimationFrame(frame);
}

function drawTraj(fx,fy,tx,ty,t){
  const peak=Math.min(fy,ty)-H*.3,pts=25,c=Math.floor(t*pts);
  ctx.save();ctx.shadowColor='rgba(255,221,68,.15)';ctx.shadowBlur=6;
  for(let i=0;i<c;i++){
    const p=i/pts,px=fx+(tx-fx)*p,py=fy*(1-p)*(1-p)+2*(1-p)*p*peak+ty*p*p;
    const alpha=p>.75?(1-p)/.25:1,sz=3+p*5;
    ctx.globalAlpha=alpha*.5;drawBall(px,py,sz);
  }
  ctx.restore();ctx.globalAlpha=1;
  if(c<pts){const p=t;drawBall(fx+(tx-fx)*p,fy*(1-p)*(1-p)+2*(1-p)*p*peak+ty*p*p,3+p*6)}
}

function getPos(e){const r=cvs.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:cx-r.left,y:cy-r.top}}

function startCharge(){
  if(G.state!=='powering'||G.animating)return;
  G.state='charging';G.power=0;G.chargeStart=performance.now();
  document.getElementById('chargeLabel').textContent='🔥 蓄力中...';
  document.getElementById('chargeBarWrap').classList.add('show');
  cancelAnimationFrame(G.chargeTimer);
  function loop(){
    if(G.state!=='charging')return;
    const el=performance.now()-G.chargeStart,pct=Math.min(el/1200,1);G.power=Math.round(pct*100);
    document.getElementById('chargeFill').style.width=G.power+'%';document.getElementById('chargePct').textContent=G.power+'%';
    document.getElementById('powerFillV').style.height=G.power+'%';document.getElementById('powerPct').textContent=G.power+'%';
    if(G.power>=100){doShoot('max');return}
    G.chargeTimer=requestAnimationFrame(loop);
  }
  G.chargeTimer=requestAnimationFrame(loop);
}

function stopCharge(){
  if(G.state!=='charging'||G.animating)return;
  cancelAnimationFrame(G.chargeTimer);
  if(G.power>0)doShoot('manual');
  else{G.state='powering';document.getElementById('chargeLabel').textContent='👆 按住蓄力';document.getElementById('chargeBarWrap').classList.remove('show')}
}

function onDown(e){
  e.preventDefault();
  if(G.state==='idle'||G.animating||selectedMode==='keeper')return;

  if(G.state==='aiming'){
    const pos=getPos(e),zs=getZones();
    const hit=zs.find(r=>pos.x>=r.x*W&&pos.x<=(r.x+r.w)*W&&pos.y>=r.y*H&&pos.y<=(r.y+r.h)*H);
    if(hit){G.aimDir=hit.key;G.state='powering';G.power=0;document.getElementById('phaseHint').textContent='↕ 调整力度后按住蓄力';document.getElementById('powerUI').classList.add('show');drawField()}
  }else if(G.state==='powering'&&G.aimDir){
    if(Math.random()<Settings.keeperRate)G.keeperDir=G.aimDir;
    else{const w=DK.filter(d=>d!==G.aimDir);G.keeperDir=w[Math.floor(Math.random()*w.length)]}
    startCharge();
  }
}
function onUp(e){e.preventDefault();if(G.state==='charging')stopCharge()}
function onMove(e){
  if(G.state==='powering'&&!G.animating){
    const pos=getPos(e),pUI=document.getElementById('powerUI'),rect=pUI.getBoundingClientRect();
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    if(cy>=rect.top&&cy<=rect.bottom){
      const rel=(cy-rect.top)/rect.height,pct=Math.round(Math.max(0,Math.min(100,(1-rel)*100)));
      G.power=pct;document.getElementById('powerFillV').style.height=pct+'%';document.getElementById('powerPct').textContent=pct+'%';
    }
  }
}

function doShoot(mode){
  if(G.animating)return;
  cancelAnimationFrame(G.chargeTimer);
  document.getElementById('chargeBarWrap').classList.remove('show');document.getElementById('powerUI').classList.remove('show');
  if(mode==='max')G.power=100;
  if(!G.power||G.power===0)G.power=50;

  const result=calcShooterResult(G.aimDir,G.keeperDir,G.power,selectedPlayer);
  if(result==='goal'){G.score++;G.streak++;if(G.streak>G.bestStreak)G.bestStreak=G.streak}else G.streak=0;
  animateShot(result);
}

function calcShooterResult(aim,keeper,power,player){
  const s=player.stats;
  let accBonus=0,missChance=.25;
  if(player.style==='finesse'){accBonus=10;missChance=.20}
  else if(player.style==='power'){accBonus=-5;missChance=.30}
  else if(player.style==='speed'){accBonus=5;missChance=.22}
  const accRoll=Math.random()*100;
  if(accRoll>s.acc+accBonus)return 'miss';
  if(power>90+accBonus&&Math.random()<missChance)return 'miss';
  if(power<8)return 'miss';
  if(aim===keeper)return 'saved';
  if(power>15+accBonus&&power<88+accBonus)return 'goal';
  if(power<=15)return Math.random()<.55?'goal':'saved';
  return 'goal';
}

/* ═══════════════════════════════════════════════
   KEEPER MODE
   ═══════════════════════════════════════════════ */
const GK = {
  aiAim: null,
  aiPower: 0,
  diveDir: null,
  diveTimer: null,

  startRound(){
    G.state = 'aiming';
    G.animating = false;
    this.aiAim = null;
    this.aiPower = 0;
    this.diveDir = null;

    // AI chooses aim and power
    this.aiAim = DK[Math.floor(Math.random() * DK.length)];
    this.aiPower = 30 + Math.floor(Math.random() * 60); // 30-90

    // Show "AI is aiming..." briefly
    document.getElementById('phaseHint').textContent = '🎯 对手正在瞄准...';
    document.getElementById('phaseHint').classList.add('show');
    document.getElementById('gkDivePad').classList.add('show');

    // After a delay, show "SHOOT!" and enable dive buttons
    setTimeout(() => {
      if(G.state !== 'aiming') return;
      document.getElementById('phaseHint').textContent = '⚡ SHOOT! 快速选择扑救方向!';
      // Auto-shoot if player doesn't react in time
      this.diveTimer = setTimeout(() => {
        if(G.state === 'aiming') this.dive('none');
      }, 2000);
    }, 800 + Math.random() * 700);
  },

  dive(dir){
    if(G.state !== 'aiming' || G.animating) return;
    clearTimeout(this.diveTimer);

    // If 'none' (timeout), player didn't react - pick a random wrong direction
    if(dir === 'none' || !DIR[dir]){
      const wrongDirs = DK.filter(d => d !== this.aiAim);
      dir = wrongDirs[Math.floor(Math.random() * wrongDirs.length)];
    }

    G.state = 'shooting';
    G.animating = true;
    this.diveDir = dir;
    SFX.play('kick');
    document.getElementById('gkDivePad').classList.remove('show');
    document.getElementById('phaseHint').classList.remove('show');

    const result = this.calcGKResult(this.aiAim, dir, this.aiPower, selectedPlayer);
    if(result === 'saved'){G.score++;G.streak++;if(G.streak>G.bestStreak)G.bestStreak=G.streak}else G.streak=0;

    // Animate from AI's perspective
    this.animateGKShot(result);
  }
};
window.GK = GK;

GK.calcGKResult = function(aiAim, diveDir, power, player){
  const s = player.stats;
  // Reflex bonus
  let reflexBonus = 0;
  if(player.style === 'reflex') reflexBonus = 15;
  else if(player.style === 'reach') reflexBonus = 5;
  else if(player.style === 'pos') reflexBonus = 8;
  else if(player.style === 'psy') reflexBonus = 10;
  else reflexBonus = 0;

  // If no dive, always goal
  if(!diveDir || diveDir === 'none') return 'goal';

  // If dive matches aim, chance to save based on reflex + reach
  if(diveDir === aiAim){
    const saveRoll = Math.random() * 100;
    const saveThreshold = (s.ref + s.reach) / 2 + reflexBonus;
    if(saveRoll < saveThreshold) return 'saved';
    // Near save - deflect
    if(saveRoll < saveThreshold + 15) return 'near';
  }

  // Wrong dive - goal (unless power is very low)
  if(power < 20) return Math.random() < 0.3 ? 'saved' : 'goal';
  return 'goal';
};

GK.animateGKShot = function(result){
  const fromX = W/2, fromY = H * 0.82;
  const gx=W*.20,gy=H*.10,gw=W*.60,gh=H*.30;
  const zs = getZones();
  const target = zs.find(z => z.key === this.aiAim);
  const toX = target ? target.cx * W : W/2;
  const toY = target ? target.cy * H : H * 0.2;

  // Where the keeper dives to
  const kd = this.diveDir;
  const keeperPos = (kd && DIR[kd]) ? { x: gx + DIR[kd].cx * gw, y: gy + DIR[kd].cy * gh } : { x: W/2, y: gy + gh*0.6 };

  // Set keeper dir for visual dive animation
  G.keeperDir = this.diveDir;

  // Create shotAnim so drawKeeper animates the dive
  shotAnim = { t: 0 };

  const start = performance.now(), dur = 600;
  function frame(now){
    const raw = Math.min((now - start) / dur, 1);
    shotAnim.t = raw;
    const et = 1 - Math.pow(1 - raw, 2);
    drawField();

    if(result === 'saved'){
      // Ball goes to keeper's hands (where keeper dove)
      const kx = keeperPos.x, ky = keeperPos.y;
      if(et < 0.7){
        drawTraj(fromX, fromY, kx, ky, et / 0.7);
      } else {
        const p = (et - 0.7) / 0.3;
        // Ball drops after save
        drawBall(kx + p*15, ky + p*30 + p*p*20, 10 + p*2);
      }
    } else if(result === 'near'){
      const kx = keeperPos.x, ky = keeperPos.y;
      if(et < 0.55){
        drawTraj(fromX, fromY, kx, ky, et / 0.55);
      } else {
        const p = (et - 0.55) / 0.45;
        const deflectX = toX + (Math.random() - 0.5) * 20;
        const deflectY = toY + (Math.random() - 0.5) * 15;
        drawBall(kx + (deflectX - kx) * p, ky + (deflectY - ky) * p, 9 + p * 3);
      }
    } else {
      // Goal - ball goes to AI's target
      const tx = toX + (Math.random() - 0.5) * 8;
      const ty = toY + (Math.random() - 0.5) * 8;
      drawTraj(fromX, fromY, tx, ty, et);
    }

    if(raw < 1) requestAnimationFrame(frame);
    else {
      G.animating = false;
      shotAnim = null;
      triggerImpactForResult(result);
      setTimeout(()=>showResult(result),400);
    }
  }
  requestAnimationFrame(frame);
};

/* ═══════════════════════════════════════════════
   RESULTS & GAME FLOW
   ═══════════════════════════════════════════════ */
function showResult(result){
  const ov=document.getElementById('resultOverlay'),icon=document.getElementById('resultIcon');
  const title=document.getElementById('resultTitle'),detail=document.getElementById('resultDetail');
  const score=document.getElementById('resultScore'),btn=document.getElementById('resultNextBtn');
  const last=G.round>=Settings.rounds;
  const isGK = selectedMode === 'keeper';

  if(result==='goal'){
    icon.textContent='⚽';title.textContent='⚡ GOAL! ⚡';title.className='result-title goal';
    detail.textContent=isGK?'扑救失败，球进了!':'完美的射门!';
    if(!isGK && G.score===Settings.rounds && G.round>=Settings.rounds) confetti();
  }else if(result==='saved'){
    icon.textContent='🧤';title.textContent=isGK?'🧤 扑救成功!':'被扑出!';title.className='result-title saved';
    detail.textContent=isGK?'你判断对了方向，精彩扑救!':'守门员判断对了方向';
  }else if(result==='near'){
    icon.textContent='⚽';title.textContent='⚡ GOAL! ⚡';title.className='result-title goal';
    detail.textContent='碰到球了但还是进了!';
  }else{
    icon.textContent='💨';title.textContent='射偏!';title.className='result-title miss';
    detail.textContent=G.power>80?'力量过大，球飞过了横梁!':'角度不够，偏出了球门!';
  }
  score.textContent=G.score+' / '+Settings.rounds;
  btn.textContent=last?'🏁 查看结果':'➡ 下一轮';
  ov.classList.add('show');
}

const Game={
  start(){
    // Reset from menu - go to mode select
    UI.showMode();
  },
  startReal(){
    G.round=0;G.score=0;G.aimDir=null;G.keeperDir=null;G.power=0;G.state='idle';G.animating=false;G.streak=0;G.bestStreak=0;
    shotAnim=null;cancelAnimationFrame(G.chargeTimer);
    document.getElementById('roundTotal').textContent=Settings.rounds;
    document.getElementById('roundCurrent').textContent='1';
    document.getElementById('scoreDisplay').textContent='0';
    document.getElementById('scoreLabel').textContent = selectedMode==='keeper'?'扑救':'进球';
    document.getElementById('phaseHint').classList.remove('show');
    document.getElementById('chargeBarWrap').classList.remove('show');
    document.getElementById('powerUI').classList.remove('show');
    document.getElementById('gkDivePad').classList.remove('show');
    document.getElementById('resultOverlay').classList.remove('show');
    document.getElementById('playerNameTag').classList.add('show');
    UI.showScreen('screen-game');resize();
    setTimeout(()=>{
      G.round=1;
      if(selectedMode==='keeper'){
        GK.startRound();
      } else {
        G.state='aiming';
        document.getElementById('phaseHint').textContent='🎯 瞄准球门!';
        document.getElementById('phaseHint').classList.add('show');
      }
      drawField();
    },400);
  },
  nextRound(){
    document.getElementById('resultOverlay').classList.remove('show');
    G.round++;if(G.round>Settings.rounds){endGame();return}
    G.aimDir=null;G.keeperDir=null;G.power=0;G.state='idle';
    document.getElementById('roundCurrent').textContent=G.round;
    if(selectedMode==='keeper'){
      GK.startRound();
    } else {
      G.state='aiming';
      document.getElementById('phaseHint').textContent='🎯 瞄准球门!';
      document.getElementById('phaseHint').classList.add('show');
    }
    drawField();
  },
  confirmExit(){if(confirm('确定退出吗？')){document.getElementById('resultOverlay').classList.remove('show');UI.backToMenu()}},
  saveScore(){
    const input=document.getElementById('playerNameInput');let nickname=input.value.trim();
    if(!nickname)return;
    if(nickname.length>10)nickname=nickname.slice(0,10);
    const lb=UI.getLB();
    // Add nickname to the current record
    const cur=lb.find(x=>x.current);
    if(cur){cur.nickname=nickname;}
    lb.sort((a,b)=>b.score-a.score||b.acc-a.acc||a.timestamp-b.timestamp);
    if(lb.length>50)lb.splice(50);
    UI.saveLB(lb);
    input.value='';
    input.placeholder='昵称已添加 ✓';
  }
};
window.Game=Game;

function endGame(){
  const isGK = selectedMode === 'keeper';
  document.getElementById('goTitle').textContent = isGK ? '🏁 守门结束' : '🏁 比赛结束';
  document.getElementById('goScore').textContent=G.score;
  document.getElementById('goTotal').textContent=Settings.rounds;
  document.getElementById('goAccuracy').textContent=Math.round(G.score/Settings.rounds*100)+'%';
  document.getElementById('goAccLabel').textContent = isGK ? '扑救率' : '射正率';
  document.getElementById('goStreak').textContent=G.bestStreak;
  document.getElementById('goStrLabel').textContent = isGK ? '连扑记录' : '连进记录';
  document.getElementById('playerNameInput').value='';
  document.getElementById('playerNameInput').placeholder='添加昵称（可选）';
  if(G.score===Settings.rounds)confetti();

  // AUTO-SAVE: Save score immediately when game ends (no manual save required)
  const lb=UI.getLB();
  lb.forEach(x=>{delete x.current});
  lb.push({name:selectedPlayer.name,player:selectedPlayer.id,mode:selectedMode,score:G.score,total:Settings.rounds,acc:G.score/Settings.rounds,streak:G.bestStreak,difficulty:Settings.difficulty,timestamp:Date.now(),current:true});
  lb.sort((a,b)=>b.score-a.score||b.acc-a.acc||a.timestamp-b.timestamp);
  if(lb.length>50)lb.splice(50);
  UI.saveLB(lb);

  UI.showScreen('screen-gameover');
}

function confetti(){
  const c=document.getElementById('confettiC'),cols=['#ffdd44','#ff4466','#44dd66','#4488ff','#dd44ff','#ff8833','#fff'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');el.className='confetti-p';
    el.style.left=Math.random()*100+'%';el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.width=(4+Math.random()*5)+'px';el.style.height=(4+Math.random()*5)+'px';
    el.style.animationDuration=(1.5+Math.random()*2)+'s';el.style.animationDelay=Math.random()*.8+'s';
    el.style.borderRadius=Math.random()>.5?'50%':'2px';
    c.appendChild(el);
  }
  setTimeout(()=>c.innerHTML='',4000);
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2;if(r>h/2)r=h/2;
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);
    return this;
  };
}
